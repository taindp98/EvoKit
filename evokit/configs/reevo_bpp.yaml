# EvoKit Configuration: ReEvo Reflective Strategy on Online Bin Packing
experiment:
  study_name: "reevo_bpp_online"
  max_generations: 5
  candidates_per_generation: 2
  evaluate_test_split: true
  test_top_k: 1
  seed_evaluation: true

storage:
  db_path: "./artifacts/reevo_bpp/experiments.db"
  artifacts_dir: "./artifacts/reevo_bpp/code"
  direction: "MINIMIZE"

gateway:
  provider: "vllm"
  base_url: "http://172.22.4.1:8000/v1"
  model: "mistralai/Devstral-Small-2-24B-Instruct-2512"
  temperature: 0.7
  max_tokens: 2048
  timeout: 120.0

benchmark:
  type: "bpp_online"
  capacity: 100.0
  num_train_instances: 5
  num_test_instances: 10
  train_items_per_instance: 200
  test_items_per_instance: 500
  seed: 42

population:
  type: "reflection_buffer"
  capacity: 10
  max_failure_history: 15
  max_reflection_memory: 10
  direction: "MINIMIZE"

mutation:
  type: "reevo"
  temperature: 0.7
  enable_reflection_loop: true

evaluator:
  type: "subprocess_sandbox"
  timeout_seconds: 30.0
