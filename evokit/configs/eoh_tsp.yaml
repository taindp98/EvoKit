# EvoKit Configuration: EoH Strategy on Constructive TSP
experiment:
  study_name: "eoh_tsp_construct"
  max_generations: 5
  candidates_per_generation: 2
  evaluate_test_split: true
  test_top_k: 1
  seed_evaluation: true

storage:
  db_path: "./artifacts/eoh_tsp/experiments.db"
  artifacts_dir: "./artifacts/eoh_tsp/code"
  direction: "MINIMIZE"

gateway:
  provider: "vllm"
  base_url: "http://172.22.4.1:8000/v1"
  model: "mistralai/Devstral-Small-2-24B-Instruct-2512"
  temperature: 0.8
  max_tokens: 2048
  timeout: 120.0

benchmark:
  type: "tsp_construct"
  train_cities: 30
  test_cities: 50
  num_train_instances: 5
  num_test_instances: 10
  seed: 42

population:
  type: "lineage_archive"
  capacity: 10
  tournament_size: 2
  direction: "MINIMIZE"

mutation:
  type: "eoh"
  temperature: 0.8
  operator_weights:
    e1: 0.25
    e2: 0.25
    m1: 0.25
    m2: 0.25

evaluator:
  type: "subprocess_sandbox"
  timeout_seconds: 30.0
